name: docs

on:
  push:
    branches: [main, rc/**]
  pull_request:
    branches: [main, rc/**]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: sphinx-build -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
